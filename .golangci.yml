# All Go files in this repository are produced by swagger-codegen (see
# GNUmakefile: `make generate`). They carry a "Generated by: Swagger Codegen"
# header rather than the canonical `// Code generated ... DO NOT EDIT.` marker,
# so golangci-lint does not auto-detect them as generated. Exclude them here so
# `golangci-lint run` reflects hand-written code only (currently none) instead
# of swagger-codegen template output that is overwritten on every refresh.
version: "2"

linters:
  exclusions:
    generated: lax
    paths:
      - "client\\.go$"
      - "configuration\\.go$"
      - "response\\.go$"
      - "api_.*\\.go$"
      - "model_.*\\.go$"
