name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
      - run: go build ./...
      - run: go vet ./...
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  provider:
    # The client is consumed by terraform-provider-bitbucket; build it and run
    # its unit tests against this version of the client, so a regeneration
    # that renames or removes something the provider uses fails here.
    name: terraform-provider-bitbucket builds against this client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DrFaust92/terraform-provider-bitbucket
          persist-credentials: false
          path: provider
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "provider/go.mod"
      - name: Build and unit-test the provider with this client
        working-directory: provider
        run: |
          go mod edit -replace github.com/DrFaust92/bitbucket-go-client=../client
          go mod tidy
          go build ./...
          go vet ./...
          go test ./... -timeout 10m
